name: probe-publish

# Fast publish-only check: runs scripts/probe_supabase.py with the repo secrets
# to verify the service key works against Storage + PostgREST, using throwaway
# data (no ingest, no model calls, ~20s). On-demand only.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Supabase (dummy data)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python scripts/probe_supabase.py
