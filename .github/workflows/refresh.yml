name: refresh-dashboard

# Re-ingest the whole corpus (VLM transcribes each table screenshot to numbers)
# and publish to Supabase. Runs weekly and on demand. Required repo secrets:
# CLAUDE_API_KEY (the reader), SUPABASE_URL, SUPABASE_SERVICE_ROLE (publish).
# For fast single-card iteration use the dev-ingest workflow instead.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  ingest-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: Python deps (ingest + publish; no OCR)
        run: |
          python -m pip install --upgrade pip
          pip install playwright pdfplumber pymupdf Pillow markupsafe
          python -m playwright install --with-deps chromium
      - name: Ingest corpus (screenshot tables -> VLM transcribe)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: ./scripts/ingest.sh
      - name: Publish to Supabase (rows + crops + table CSVs)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          mkdir -p var
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE" > var/supabase.env
          ./scripts/publish.sh
