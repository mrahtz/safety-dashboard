name: refresh-dashboard

# Re-ingest the corpus and publish the results to Supabase. Runs weekly and on
# demand. Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE. Optional:
# CLAUDE_API_KEY (enables the VLM cross-check; without it, numbers fall back to
# the structural + OCR-presence 'accepted' status).
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      use_vlm:
        description: "Run the VLM cross-check (slower, ~12 min). Off => numbers land as accepted/needs_review."
        type: boolean
        default: true

jobs:
  ingest-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps (tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright pdfplumber pymupdf pytesseract Pillow markupsafe
          python -m playwright install --with-deps chromium
      - name: Ingest corpus (freeze + extract + verify)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          # When dispatched with use_vlm=false, disable the VLM cross-check so the
          # run skips ~470 model calls and falls back to the structural+OCR signal.
          LLM_METRICS_NO_VLM: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_vlm == false) && '1' || '' }}
        run: ./scripts/ingest.sh
      - name: Publish to Supabase (rows + crops)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          mkdir -p var
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE" > var/supabase.env
          ./scripts/publish.sh
