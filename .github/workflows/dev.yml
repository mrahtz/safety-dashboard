name: dev-ingest

# Fast iteration loop: ingest just one or two cards and dump the VLM table
# transcriptions to the log -- NO publish (never touches the live Supabase data,
# whose ids would collide with a partial run). Caches pip + the Playwright
# browser and skips OCR, so a warm run is ~1-2 min instead of the full ~8.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "model_ids to ingest, space-separated (e.g. 'gpt-5-5 gemini-2-0-flash'). Small default for speed."
        default: "gemini-3-pro"

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: Deps (ingest only; no OCR)
        run: |
          python -m pip install --upgrade pip
          pip install playwright pdfplumber pymupdf Pillow markupsafe
          python -m playwright install --with-deps chromium
      - name: Ingest selected cards + dump transcriptions (no publish)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          PYTHONPATH=src python3 -m llm_metrics.pipeline ${{ inputs.sources }}
          PYTHONPATH=src python3 scripts/dump_tables.py
