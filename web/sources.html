<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>LLM safety-metrics — sources</title>
<style>
 .layout{display:grid;grid-template-columns:260px 1fr;gap:14px}
 .side{align-self:start;position:sticky;top:14px;max-height:84vh;overflow:auto}
 .src{display:block;width:100%;text-align:left;border:1px solid #d7dee8;background:#fff;border-radius:8px;
   padding:8px 10px;margin:6px 0;cursor:pointer}
 .src.on{background:#1565d8;color:#fff;border-color:#1565d8}
 .src .n{float:right;opacity:.7;font-size:12px}
 .section{margin:16px 0;border-top:1px solid #e3e8ef;padding-top:14px}
 .section h3{margin:0 0 2px;font-size:15px}
 .shot{border:1px solid #c9d2df;border-radius:8px;max-width:100%;margin:8px 0;background:#fff}
 table.nums{border-collapse:collapse;width:100%;font-size:13px}
 table.nums th,table.nums td{border:1px solid #e6eaf1;padding:5px 8px;text-align:left;vertical-align:top}
 table.nums th{background:#f3f6fb}
 td.raw{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
 .section details{margin-top:8px} .section summary{cursor:pointer;color:#3a5273;font-size:13px}
</style></head><body>
<main>
 <div class=card>
   <div style="font-size:18px;font-weight:700">Numbers by source</div>
   <div class=muted>Pick a card on the left to see every number extracted from it, grouped by
     table/figure (model · condition · subset · benchmark · value).</div>
 </div>
 <div class=layout>
   <div class=side id=side></div>
   <div id=content class=card>Loading from Supabase…</div>
 </div>
</main>
<script src="common.js?v=20260614"></script>
<script>
let SRC = [], current = null;

async function load() {
  mountChrome("sources.html");
  const data = await loadMetrics();
  SRC = [...groupBySource(data).entries()]
    .map(([url, items]) => ({ url, label: sourceLabel(url), sections: groupBySection(items, "_") }))
    .sort((a, b) => a.label.localeCompare(b.label));
  document.getElementById("side").innerHTML = SRC.map((s, i) => {
    const n = [...s.sections.values()].reduce((t, items) => t + items.length, 0);
    return `<button class=src id=src${i} onclick=pick(${i})>${esc(s.label)}<span class=n>${n}</span></button>`;
  }).join("");
  if (SRC.length) pick(0); else document.getElementById("content").innerHTML = "<span class=muted>No data.</span>";
}

function numsTable(items) {
  const sorted = items.slice().sort((a, b) =>
    (a.row_idx ?? 1e9) - (b.row_idx ?? 1e9) || (a.col_idx ?? 1e9) - (b.col_idx ?? 1e9));
  let h = "<table class=nums><thead><tr><th>model<th>condition<th>subset<th>benchmark<th>value</tr></thead><tbody>";
  for (const c of sorted)
    h += `<tr><td>${esc(c.model)}</td><td>${esc(c.condition || "—")}</td><td>${esc(c.subset || "—")}</td>`
       + `<td>${esc(c.benchmark)}</td><td class=raw>${esc(fmtVal(c.value, c.units))}</td></tr>`;
  return h + "</tbody></table>";
}

function pick(i) {
  current = i;
  SRC.forEach((_, j) => document.getElementById("src" + j).classList.toggle("on", j === i));
  const s = SRC[i];
  const sections = [...s.sections.entries()].sort((a, b) =>
    a[0].localeCompare(b[0], undefined, { numeric: true }));
  let html = `<div style="font-size:17px;font-weight:700">${esc(s.label)}</div>
    <div class=muted><a href="${esc(s.url)}" target=_blank>${esc(s.url)}</a> — ${sections.length} table(s)</div>`;
  for (const [key, items] of sections) {
    const allAccepted = items.every(c => c.accepted);
    const badge = allAccepted ? `<span class="flag s-accepted">accepted</span>` : "";
    html += `<div class=section><h3>Table ${esc(key)} ${badge}</h3>
      <div class=muted>${items.length} numbers</div>`;
    html += numsTable(items) + `</div>`;
  }
  document.getElementById("content").innerHTML = html;
}

load().catch(err => document.getElementById("content").innerHTML =
  `<span style="color:#c0143c">Load failed: ${esc(err.message || err)}</span>`);
</script></body></html>
