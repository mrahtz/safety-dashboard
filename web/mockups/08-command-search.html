<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup 8 — Command Search / Add</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;margin:0;color:#111;background:#eef1f5}
header{background:#0b1320;color:#fff;padding:10px 22px;display:flex;align-items:baseline;gap:16px}
header b{font-size:17px}
.back{color:#9fb3c8;text-decoration:none;font-size:13px}
.num{margin-left:auto;color:#9fb3c8;font-size:12px}
main{padding:16px;max-width:1400px;margin:0 auto}
.card{background:#fff;border:1px solid #d7dee8;border-radius:10px;padding:14px 16px;margin:10px 0}
.muted{color:#566;font-size:13px}
button,select,input{font:inherit;padding:5px 10px;border:1px solid #b9c2d0;border-radius:7px;background:#fff;cursor:pointer}
button.on{background:#1565d8;color:#fff;border-color:#1565d8}
.mwrap{overflow:auto;border:1px solid #d7dee8;border-radius:10px;background:#fff;margin-top:10px}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px}
table.mx th,table.mx td{border-right:1px solid #eef0f4;border-bottom:1px solid #eef0f4;padding:6px 10px;white-space:nowrap}
table.mx thead th{position:sticky;top:0;z-index:2;background:#f1f4f9;vertical-align:bottom}
.band{background:#e7edf6;text-align:left;font-size:11px;color:#3a5273;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.mh{position:sticky;left:0;z-index:2;background:#fff;text-align:left;font-weight:700;min-width:150px}
thead .mh{z-index:5;background:#f1f4f9}
.cell{text-align:right}
.cell.sc{background:#eef5ff}
</style>
</head>
<body>
<header>
  <b>LLM safety-metrics</b>
  <a href="index.html" class="back">← all mockups</a>
  <span class="num">Mockup 8 of 10 — Command Search / Add</span>
</header>
<main>
  <div class="card">
    <div class="muted">Type to search and add models. Selected models shown as removable badges. Sort via dropdown.</div>
  </div>

  <div class="card">
    <!-- Row 1: badges -->
    <div style="margin-bottom:12px">
      <div style="font-size:12px;color:#566;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Selected models:</div>
      <div id="badges" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:32px"></div>
    </div>

    <!-- Row 2: search input + picker -->
    <div style="margin-bottom:12px">
      <div style="position:relative;display:inline-block">
        <input id="sq" placeholder="Search to add model…" oninput="updatePicker()" onfocus="updatePicker()" style="width:220px">
        <div id="picker" style="position:absolute;z-index:10;background:#fff;border:1px solid #b9c2d0;border-radius:8px;padding:4px;min-width:220px;display:none;top:calc(100% + 4px);left:0;box-shadow:0 4px 12px rgba(0,0,0,.12)"></div>
      </div>
    </div>

    <!-- Row 3: sort -->
    <div>
      <label style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:#566;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Sort by:</span>
        <select id="sortSel" onchange="sortChange()">
          <option value="">— none —</option>
        </select>
        <span class="muted">(highest value first)</span>
      </label>
    </div>
  </div>

  <div class="mwrap">
    <table class="mx" id="t" style="width:100%"></table>
  </div>
</main>
<script>
const M=['GPT-5','Claude Opus 4.5','Gemini 3 Pro','Grok 4','Kimi K2'];
const B=[
  {n:'MMLU',     c:'Knowledge & Reasoning',s:[92.1,90.8,91.5,89.4,88.7]},
  {n:'GPQA',     c:'Knowledge & Reasoning',s:[67.2,72.4,68.9,71.3,65.8]},
  {n:'HumanEval',c:'Code & Agentic',       s:[96.5,93.2,94.8,95.1,91.7]},
  {n:'SWE-Bench',c:'Code & Agentic',       s:[65.8,61.4,59.2,58.7,54.3]},
  {n:'Cybench',  c:'Safety & Refusal',     s:[42.3,38.7,45.1,36.2,39.8]},
  {n:'OverRefuse',c:'Safety & Refusal',    s:[87.5,92.3,85.4,82.1,84.6]},
];
const CATS=['Knowledge & Reasoning','Code & Agentic','Safety & Refusal'];
let sel=new Set([0,1,2,3,4]);
let sortBy=-1;

// Populate sort select
const sortSel=document.getElementById('sortSel');
B.forEach((b,j)=>{
  const o=document.createElement('option');
  o.value=j;o.textContent=b.n;
  sortSel.appendChild(o);
});

function getOrder(){
  let mi=[...sel].sort((a,b)=>a-b);
  if(sortBy>=0) mi.sort((a,b)=>B[sortBy].s[b]-B[sortBy].s[a]);
  return mi;
}
function renderTable(){
  const order=getOrder();
  let h=`<thead><tr><th class="mh band" rowspan=2>model \\ benchmark</th>`;
  CATS.forEach(c=>{const n=B.filter(b=>b.c===c).length;h+=`<th class=band colspan="${n}">${c}</th>`;});
  h+=`</tr><tr>`;
  B.forEach((b,j)=>{
    const on=sortBy===j;
    h+=`<th class="${on?'on':''}" onclick="setSort(${j})" style="cursor:pointer;font-weight:600;color:#1b2b44;padding:6px 10px">${b.n} ${on?'▼':'⇅'}</th>`;
  });
  h+=`</tr></thead><tbody>`;
  order.forEach(i=>{
    h+=`<tr><td class=mh>${M[i]}</td>`;
    B.forEach((b,j)=>h+=`<td class="cell${sortBy===j?' sc':''}">${b.s[i]}%</td>`);
    h+=`</tr>`;
  });
  h+=`</tbody>`;
  document.getElementById('t').innerHTML=h;
}
function setSort(j){sortBy=sortBy===j?-1:j;sortSel.value=sortBy>=0?sortBy:'';afterState();}
function sortChange(){sortBy=sortSel.value===''?-1:parseInt(sortSel.value);afterState();}

function remove(i){sel.delete(i);afterState();}
function addModel(i){sel.add(i);document.getElementById('sq').value='';afterState();}

function updatePicker(){
  const q=document.getElementById('sq').value.toLowerCase();
  const picker=document.getElementById('picker');
  const notSel=M.map((_,i)=>i).filter(i=>!sel.has(i)&&M[i].toLowerCase().includes(q));
  if(notSel.length===0){picker.style.display='none';return;}
  picker.style.display='block';
  picker.innerHTML=notSel.map(i=>`<div onclick="addModel(${i})" style="padding:6px 10px;cursor:pointer;border-radius:6px;white-space:nowrap" onmouseover="this.style.background='#f1f4f9'" onmouseout="this.style.background=''">${M[i]}</div>`).join('');
}

function afterState(){
  // Rebuild badges
  const bd=document.getElementById('badges');
  if(sel.size===M.length){
    bd.innerHTML=`<a href="#" onclick="sel=new Set();afterState();return false" style="color:#1356b3;font-size:13px;text-decoration:underline">Clear all</a>`;
  } else {
    let bh='';
    [...sel].sort((a,b)=>a-b).forEach(i=>{
      bh+=`<span style="background:#dbeafe;color:#1356b3;border-radius:20px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px">${M[i]}<button onclick="remove(${i})" style="background:none;border:none;cursor:pointer;color:#1356b3;font-size:15px;padding:0;margin:0;line-height:1">×</button></span>`;
    });
    if(sel.size<M.length){
      bh+=`<a href="#" onclick="sel=new Set([0,1,2,3,4]);afterState();return false" style="color:#1356b3;font-size:13px;text-decoration:underline;padding:4px 0">Add all</a>`;
    }
    bd.innerHTML=bh;
  }
  // Update picker
  updatePicker();
  // Update sort select
  sortSel.value=sortBy>=0?sortBy:'';
  renderTable();
}

// Close picker when clicking outside
document.addEventListener('click',e=>{
  if(!e.target.closest('#sq')&&!e.target.closest('#picker')){
    document.getElementById('picker').style.display='none';
  }
});

afterState();
</script>
</body>
</html>
