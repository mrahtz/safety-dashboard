[project]
name = "llm-metrics"
version = "0.0.0"
description = "LLM-metrics ingestion pipeline with screenshot provenance"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.40",   # HTML table screenshots
    "pdfplumber>=0.11",   # PDF page iteration + text layer
    "pymupdf>=1.24",      # PDF page rasterize (imported as fitz)
]
# The VLM reader calls the Anthropic API over the standard library, so it needs
# no extra package -- only a funded CLAUDE_API_KEY in the environment.

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
